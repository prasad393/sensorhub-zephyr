# Logging & Shell
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Sensor readings are printed with %f
CONFIG_CBPRINTF_FP_SUPPORT=y

# Threads
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 100 us kernel ticks (native_sim defaults to 10 ms) so the producer can space
# samples evenly at rates up to 500 Hz
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Random
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# MQTT bridge stub (see Kconfig)
CONFIG_SENSORHUB_MQTT=n
