name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      # The repo is checked out into a west workspace, next to zephyr/
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: sensorhub-zephyr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            device-tree-compiler gcc-multilib g++-multilib ninja-build

      # Same steps as "Set up a workspace" in the README
      - name: Set up the west workspace
        run: |
          python -m venv .venv
          source .venv/bin/activate
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          pip install west
          west init -l sensorhub-zephyr
          west update --narrow -o=--depth=1
          west packages pip --install

      # Builds the app and every test with warnings as errors, runs the unit
      # tests, and boots the app to check its telemetry output
      - name: Build and test with Twister
        working-directory: sensorhub-zephyr
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: west twister -T . -p native_sim -p native_sim/native/64 -v --inline-logs

      - name: Upload Twister reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-reports
          path: |
            sensorhub-zephyr/twister-out/twister.json
            sensorhub-zephyr/twister-out/twister.xml
          if-no-files-found: ignore
